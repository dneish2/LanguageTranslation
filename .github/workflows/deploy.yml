name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -q

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP
        run: gcloud auth configure-docker

      - name: Build and Push Docker image
        run: |
          docker build -t gcr.io/translation-app-452812/translation-app:${{ github.sha }} .
          docker push gcr.io/translation-app-452812/translation-app:${{ github.sha }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: translation-app
          region: us-central1
          image: gcr.io/translation-app-452812/translation-app:${{ github.sha }}
          # NiceGUI is server-stateful: UI elements live in process memory
          # keyed to a client id, and the WebSocket IS the request. Two Cloud
          # Run defaults are hostile to that and both cost nothing to change
          # (DECISIONS.md §7):
          #   --timeout=3600      the 300s default kills every live session
          #                       after five minutes, mid-document.
          #   --session-affinity  best-effort, but without it a reconnect can
          #                       land on an instance holding none of this
          #                       client's state.
          # --min-instances=1 is the third item in that table and is NOT set
          # here on purpose: it bills continuously, and scale-to-zero taking
          # idle sessions with it is the acceptable half of the trade.
          # Unverified against the real service — reasoned from documented
          # behaviour. The honest test is to deploy, open a session and watch
          # when it drops.
          flags: --timeout=3600 --session-affinity
          env_vars: |
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}

name: Deploy to Cloud Run

on:
  # Push to main only. The `pull_request` trigger was here to pre-validate a PR,
  # but ci.yml already runs the identical suite on every PR — this workflow's
  # job is the gate in front of the Cloud Run deploy, which only ever happens on
  # a push to main.
  push:
    branches: [main]

jobs:
  # The gate, called rather than copied. This job used to be a second,
  # hand-maintained ubuntu test job — the same tests ci.yml was already
  # running on every push, minus the banner that says what the runner
  # resolved. Two copies of "how the suite runs" is one copy too many when one
  # of them decides whether code reaches production.
  test:
    uses: ./.github/workflows/suite.yml
    with:
      # Ubuntu alone, not the breadth matrix. This gate decides whether code
      # reaches Cloud Run, which runs on ubuntu; making a deployment wait on a
      # macOS runner's queue buys nothing it does not already have, because
      # ci.yml runs the full matrix on the very same commit.
      matrix: '[{"os": "ubuntu-latest", "stable": true}]'

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP
        run: gcloud auth configure-docker

      - name: Build and Push Docker image
        run: |
          docker build -t gcr.io/translation-app-452812/translation-app:${{ github.sha }} .
          docker push gcr.io/translation-app-452812/translation-app:${{ github.sha }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: translation-app
          region: us-central1
          image: gcr.io/translation-app-452812/translation-app:${{ github.sha }}
          # NiceGUI is server-stateful: UI elements live in process memory
          # keyed to a client id, and the WebSocket IS the request. Two Cloud
          # Run defaults are hostile to that and both cost nothing to change
          # (DECISIONS.md §7):
          #   --timeout=3600      the 300s default kills every live session
          #                       after five minutes, mid-document.
          #   --session-affinity  best-effort, but without it a reconnect can
          #                       land on an instance holding none of this
          #                       client's state.
          # --min-instances=1 is the third item in that table and is NOT set
          # here on purpose: it bills continuously, and scale-to-zero taking
          # idle sessions with it is the acceptable half of the trade.
          # Unverified against the real service — reasoned from documented
          # behaviour. The honest test is to deploy, open a session and watch
          # when it drops.
          flags: --timeout=3600 --session-affinity
          # PASSAGE_CONTRIBUTION_BUCKET comes from a repository VARIABLE. While
          # it is unset, the switch to contribute corrections is not offered and
          # the page says nothing is kept (DECISIONS.md §10).
          env_vars: |
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            PASSAGE_CONTRIBUTION_BUCKET=${{ vars.PASSAGE_CONTRIBUTION_BUCKET }}
